<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://caretparrot.github.io/papaya-salad/Profile Picture.png">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="https://caretparrot.github.io/papaya-palettes/default.css">
        <link rel="stylesheet" href="./styles.css">
        <script defer src="https://caretparrot.github.io/papaya-salad/script.js"></script>
        <script defer src="./main.js"></script>
        <title>Noteworthy</title>
    </head>

    <body>
        <div id="editor-page" class="page">
            <h1>Editor</h1>
            <div class="toolbar">
                <input type="file" id="editor-file-import" accept=".json">
                <button id="save-button">Save</button>
                <button onclick="openShortcuts()">Shortcuts</button>
                <button onclick="pageGroup.changePage('flashcards-page')">Flashcards</button>
            </div>
            <div id="database-wrapper">
                <a class="label" data-parent="-1"></a>
                <input class="key" placeholder="Term" id="0-key">
                <textarea class="value" placeholder="Definition" id="0-value"></textarea>
            </div>
            <dialog id="file-name-dialog">
                <input id="file-name-input" type="text" placeholder="Name the file...">
                <button onclick="closeDialogs()">Close</button>
            </dialog>
            <dialog id="keyboard-shortcuts-dialog">
                <p>
                    Ctrl+s: Save To Disk<br>
                    Ctrl+o: Open File<br>
                    Shift+Enter: Add New Line Within Definition<br>
                    Ctrl+Enter: Add Linked Note<br>
                    Ctrl+/: Open Shortcuts
                </p>
                <button onclick="closeDialogs()">Close</button>
            </dialog>
        </div>
        <div id="flashcards-page" class="page">
            <h1>Flashcards</h1>
            <div class="toolbar">
                <input type="file" id="flashcard-file-import" accept=".json">
                <button onclick="openShortcuts()">Shortcuts</button>
                <button id="save-progress-button">Save</button>
                <button onclick="pageGroup.changePage('editor-page')">Editor</button>
            </div>
            <div id="flashcards">
                <button onclick="Flashcards.changeFlashcard(-1)">&lt;-</button>
                <div id="flashcards-display" data-number="0">

                </div>
                <button onclick="Flashcards.changeFlashcard(1)">-&gt;</button>
            </div>
            <div id="learn-confirm">
                <button onclick="Flashcards.changeRetention(1)">&#10003;</button>
                <button onclick="Flashcards.changeRetention(-2)">&#10007;</button>
                <label id="flashcards-progress">?/?</label>
                <label id="flashcards-retention">?</label>
            </div>
            <dialog id="save-progress-dialog">
                <input id="save-name-input" type="text" placeholder="Name the file...">
                <button onclick="closeDialogs()">Close</button>
            </dialog>
        </div>
    </body>

</html>
