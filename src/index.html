<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://caretparrot.github.io/papaya-salad/Profile Picture.png">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="https://caretparrot.github.io/papaya-palettes/default.css">
        <link rel="stylesheet" href="./styles.css">
        <script defer src="https://caretparrot.github.io/papaya-salad/script.js"></script>
        <script defer src="./main.js"></script>
        <title>Noteworthy</title>
    </head>

    <body>
        <div id="editorPage" class="page">
            <h1>Editor</h1>
            <div id="toolbar">
                <input type="file" id="editorFileImport" accept=".csv,.txt">
                <button id="saveButton">Save</button>
                <button onclick="openShortcuts()">Shortcuts</button>
                <button onclick="pageGroup.changePage('flashcardsPage')">Flashcards</button>
            </div>
            <div id="database-wrapper">
                <a class="label" data-parent="-1"></a>
                <input class="key" placeholder="Term" id="0-key">
                <textarea class="value" placeholder="Definition" id="0-value"></textarea>
            </div>
            <dialog id="fileNameDialog">
                <input id="fileNameInput" type="text" placeholder="Name the file...">
                <button onclick="closeDialogs()">Close</button>
            </dialog>
            <dialog id="keyboardShortcutsDialog">
                <p>
                    Ctrl+s: Save To Disk<br>
                    Ctrl+o: Open File<br>
                    Shift+Enter: Add New Line Within Definition<br>
                    Ctrl+Enter: Add Linked Note<br>
                    Ctrl+/: Open Shortcuts
                </p>
                <button onclick="closeDialogs()">Close</button>
            </dialog>
        </div>
        <div id="flashcardsPage" class="page">
            <h1>Flashcards</h1>
            <div id="toolbar">
                <input type="file" id="flashcardFileImport" accept=".csv,.txt">
                <button onclick="openShortcuts()">Shortcuts</button>
                <button onclick="pageGroup.changePage('editorPage')">Editor</button>
            </div>
            <div id="flashcards">
                <button onclick="changeFlashcard(-1)">&lt;-</button>
                <div id="flashcardsDisplay" data-number="0">
                    
                </div>
                <button onclick="changeFlashcard(1)">-&gt;</button>
            </div>
            <label id="flashcardsProgress">?/?</label>
        </div>
    </body>
</html>
